name: Deploy Docs

on:
  push:
    branches: [main]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Only allow one deploy at a time, cancel in-progress runs
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          package-manager-cache: false # no shared cache in a deploy job

      # Install exactly what's in the committed lockfile, without running
      # dependency install scripts, before the deploy key is in scope.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build core library
        run: npm run build --workspace=packages/fluent-convex

      # Deploy Convex backend first so _generated types are up to date
      # before the frontend tsc build runs
      - name: Deploy Convex backend
        working-directory: apps/docs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      # Build frontend and upload static files to Convex storage
      - name: Build and upload static site
        working-directory: apps/docs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx @convex-dev/self-hosting upload --build --prod
