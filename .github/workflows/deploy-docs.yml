name: Deploy Docs

on:
  push:
    branches: [main]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Only allow one deploy at a time, cancel in-progress runs
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false # no shared cache in a deploy job

      # Install exactly what's in the committed lockfile, without running
      # dependency install scripts, before the deploy key is in scope.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build core library
        run: npm run build --workspace=packages/fluent-convex

      # Deploy Convex backend first so _generated types are up to date
      # before the frontend tsc build runs
      - name: Deploy Convex backend
        working-directory: apps/docs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      # Build frontend and upload static files to Convex storage
      - name: Build and upload static site
        working-directory: apps/docs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        # The component keeps its old instance name, see convex/convex.config.ts
        run: npx @convex-dev/static-hosting upload --build --prod --component selfHosting
