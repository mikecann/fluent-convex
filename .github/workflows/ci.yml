name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package first
        run: npm run build --workspace=packages/fluent-convex

      # Load dist/ with Node's own ESM loader, no bundler, the way consumers
      # outside this monorepo do. Catches extensionless relative imports (#8).
      - name: Import built package in plain Node
        run: npm run check:dist --workspace=packages/fluent-convex

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package (verify)
        run: npm run build

  # The lockfile pins one version of each peer. This job also tries the newest
  # convex / convex-helpers / zod, and the oldest zod we claim (3.25, via its
  # zod/v4 subpath), so a peer release that breaks us shows up here first.
  peers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zod: ['latest', '3.25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The root override pins convex-helpers for the lockfile and would clash
      # with @latest, so drop it in this throwaway checkout. Installing into the
      # package's own workspace makes its tests resolve these versions.
      - name: Install latest peers
        run: |
          npm pkg delete overrides
          npm install --no-save --ignore-scripts -w packages/fluent-convex convex@latest convex-helpers@latest zod@${{ matrix.zod }}
          npm ls convex convex-helpers zod -w packages/fluent-convex --depth=0

      - name: Build
        run: npm run build --workspace=packages/fluent-convex

      - name: Import and type-check the built package as a consumer would
        run: npm run check:dist --workspace=packages/fluent-convex

      - name: Run package tests
        run: npm test --workspace=packages/fluent-convex
